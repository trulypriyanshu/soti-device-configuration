name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Wrapper & Build Debug APK
      run: |
        cd android
        gradle wrapper
        gradle assembleDebug --stacktrace

    - name: Build Release Signed APK
      run: |
        cd android
        gradle assembleRelease --stacktrace

    - name: Prepare Signed APKs for Download
      run: |
        mkdir -p output_apks
        if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
          cp android/app/build/outputs/apk/release/app-release.apk output_apks/SOTI-MobiControl-Release-Signed.apk
        fi
        if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apks/SOTI-MobiControl-Debug.apk
        fi
        ls -la output_apks

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SOTI-MobiControl-Signed-APK
        path: output_apks/*.apk
        if-no-files-found: error
